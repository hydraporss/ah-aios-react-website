<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page not found · AH-AIOS</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#060d1a;color:#e9f1ff;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px}a{color:#27b9ff}</style></head>
<body><main><h1>That page isn’t here</h1><p>The link may be old or mistyped.</p><p><a id="home" href="./">Go to the AH-AIOS home page</a> · <a id="hub" href="./hub.html">Browse all parts</a></p></main>
<script>
/* GitHub Pages serves this file at the *missing* URL, so "./" would resolve against it.
   On a project site (user.github.io/<repo>/...) the site root is the first path segment. */
(function(){try{var h=location.hostname,seg=location.pathname.split("/").filter(Boolean)[0],base="/";
if(/\.github\.io$/i.test(h)&&seg)base="/"+seg+"/";
document.getElementById("home").href=base;document.getElementById("hub").href=base+"hub.html"}catch(e){}})();
</script></body></html>
