name: desktop-windows
# Builds the Windows installer and portable .exe. Run manually (Actions tab) or push a tag like v0.5.1.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # only used to attach files to a GitHub Release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AH-AIOS-windows
          path: |
            desktop/dist/*.exe
          if-no-files-found: error
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
