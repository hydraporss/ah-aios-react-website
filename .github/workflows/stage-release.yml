name: stage-release
# One-shot helper. AH-AIOS-Master-Release.zip must be at the ROOT of branch release/0.5.1.
# Runs when that zip is pushed, OR when this workflow file itself is pushed (so it also works
# if the zip was uploaded before this file existed).
# It verifies the archive, replaces the old site with the release, and commits.
# It never edits anything under .github/ (GitHub does not let the built-in token change workflows).
# Nothing is deployed by this workflow: the site only goes live after a PR is merged into main.
on:
  push:
    branches: [release/0.5.1]
    paths:
      - 'AH-AIOS-Master-Release.zip'
      - '.github/workflows/stage-release.yml'

permissions:
  contents: write

concurrency:
  group: stage-release
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      ZIP: AH-AIOS-Master-Release.zip
      EXPECTED_ZIP_SHA: 7aa7514155520686672973ed4e003103487a32ae5b9941a0e0b22015b3a2d3ad
      EXPECTED_FILES: '276'
      BACKUP_BRANCH: backup/before-master-release-0.5.1
      BACKUP_SHA: 6788ecef6c0a34bc94e08f76d1cff5ca45a8fc22
      TARGET_BRANCH: release/0.5.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify archive and safety net
        run: |
          set -euo pipefail
          [ -f "$ZIP" ] || { echo "::error::$ZIP is not at the root of this branch. Upload it to the root of $TARGET_BRANCH, then re-run."; exit 1; }
          ACTUAL="$(sha256sum "$ZIP" | cut -d' ' -f1)"
          [ "$ACTUAL" = "$EXPECTED_ZIP_SHA" ] || { echo "::error::Wrong zip. sha256 is $ACTUAL, expected $EXPECTED_ZIP_SHA. Upload the INNER AH-AIOS-Master-Release.zip."; exit 1; }
          unzip -tq "$ZIP" > /dev/null
          REL="$RUNNER_TEMP/release"; rm -rf "$REL"; mkdir -p "$REL"
          unzip -q "$ZIP" -d "$REL"
          COUNT="$(find "$REL" -type f | wc -l | tr -d ' ')"
          [ "$COUNT" = "$EXPECTED_FILES" ] || { echo "::error::Archive has $COUNT files, expected $EXPECTED_FILES"; exit 1; }
          python3 - "$REL" <<'PY'
          import json, hashlib, os, sys
          root = sys.argv[1]
          m = json.load(open(os.path.join(root, "release-manifest.json")))
          assert m["version"] == "0.5.1", m["version"]
          bad = [e["path"] for e in m["files"]
                 if not os.path.isfile(os.path.join(root, e["path"]))
                 or hashlib.sha256(open(os.path.join(root, e["path"]), "rb").read()).hexdigest() != e["sha256"]]
          print("manifest entries:", len(m["files"]), "problems:", len(bad))
          sys.exit(1 if bad else 0)
          PY
          # Safety net: the backup of the old site must exist and point at the known old-main commit
          git fetch origin "$BACKUP_BRANCH" --quiet || { echo "::error::Backup branch $BACKUP_BRANCH not found. Stopping."; exit 1; }
          GOT="$(git rev-parse FETCH_HEAD)"
          [ "$GOT" = "$BACKUP_SHA" ] || { echo "::error::Backup branch is at $GOT, expected $BACKUP_SHA. Stopping."; exit 1; }
          echo "Archive verified (hash, 276 files, manifest). Backup branch confirmed."

      - name: Replace site with release
        run: |
          set -euo pipefail
          REL="$RUNNER_TEMP/release"
          # 1. remove old tracked files, keeping .github/ (token cannot edit workflows), CNAME and the zip
          ( git ls-files -z | grep -zvE '^(\.github/|CNAME$|AH-AIOS-Master-Release\.zip$)' || true ) | xargs -0 -r git rm -q -f --
          # 2. copy the release in, except .github/
          tar -C "$REL" --exclude='./.github' -cf - . | tar -xf -
          # 3. stage everything, force-adding files the release's own .gitignore would hide
          git add -A
          ( cd "$REL" && find . -type f -not -path './.github/*' -print0 ) | xargs -0 git add -f --
          # 4. drop the uploaded zip from the tree
          git rm -q -f "$ZIP"
          # 5. prove every release file (outside .github) is staged
          MISSING=0
          while IFS= read -r f; do
            git ls-files --error-unmatch -- "$f" > /dev/null 2>&1 || { echo "::error::not staged: $f"; MISSING=1; }
          done < <( cd "$REL" && find . -type f -not -path './.github/*' | sed 's|^\./||' )
          [ "$MISSING" = 0 ] || exit 1
          # 6. the three release workflows must already be on the branch, byte-identical
          for w in pages ci backend; do
            F=".github/workflows/$w.yml"
            [ -f "$F" ] || { echo "::error::$F is missing on the branch. Add it (copy from the release) and re-run."; exit 1; }
            [ "$(git hash-object "$F")" = "$(git hash-object "$REL/$F")" ] || { echo "::error::$F differs from the release version. Replace it with the release copy and re-run."; exit 1; }
          done

      - name: Summary, commit and push
        run: |
          set -euo pipefail
          S="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          A="$(git diff --cached --no-renames --name-status | awk '$1=="A"' | wc -l | tr -d ' ')"
          M="$(git diff --cached --no-renames --name-status | awk '$1=="M"' | wc -l | tr -d ' ')"
          D="$(git diff --cached --no-renames --name-status | awk '$1=="D" && $2!="AH-AIOS-Master-Release.zip"' | wc -l | tr -d ' ')"
          {
            echo "## stage-release result"
            echo "Added: $A | Modified: $M | Deleted old-site files: $D"
            echo
            echo "### Still to do by hand (the built-in token cannot edit workflows)"
            [ ! -f .github/workflows/deploy.yml ] || echo "- DELETE \`.github/workflows/deploy.yml\` (old deploy workflow still present)"
            echo "- DELETE \`.github/workflows/stage-release.yml\` once this has succeeded (one-shot helper)"
            echo
            echo "### Old-site files deleted (review these)"
            echo '```'
            git diff --cached --no-renames --name-status | awk '$1=="D" && $2!="AH-AIOS-Master-Release.zip"{print $2}' | head -400
            echo '```'
          } >> "$S"
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Stage Release 0.5.1 from AH-AIOS-Master-Release.zip" \
            -m "sha256 $EXPECTED_ZIP_SHA, $EXPECTED_FILES files, verified against release-manifest.json. Old site replaced; .github/ untouched."
          git push origin "HEAD:$TARGET_BRANCH"
