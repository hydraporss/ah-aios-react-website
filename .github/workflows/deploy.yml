name: Learning Studio — verify and deploy

on:
  push:
    branches: [main, feat/learning-studio-data-integrity-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Learning Studio and preserved WorldForge regression tests
        run: pnpm test
      - name: Check Learning Studio JavaScript syntax
        run: |
          node --check app.js
          node --check theory-validation.js
          node --check progress-integrity.js
      - name: Verify required root application files
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s manifest.webmanifest
          test -s sw.js
          test -s icon.svg
          test -s curriculum-data.js
          test -s theory-validation.js
          test -s progress-integrity.js
      - name: Install Chromium for browser acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the production site
        run: pnpm build
      - name: Copy static Learning Studio runtime assets into the Pages artifact
        run: |
          cp app.js styles.css manifest.webmanifest sw.js icon.svg curriculum-data.js theory-validation.js progress-integrity.js dist/
      - name: Smoke-test the built root application
        run: |
          python3 -m http.server 4173 --directory dist > /tmp/learning-studio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm test:browser
      - name: Verify production artifact
        run: |
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/curriculum-data.js
          test -s dist/theory-validation.js
          test -s dist/progress-integrity.js
          test -s dist/manifest.webmanifest
          find dist -maxdepth 2 -type f
      - name: Upload verified Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
