name: Deploy WorldForge and AH-AIOS Learning Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run WorldForge governance tests
        run: pnpm test
      - name: Verify Learning Studio
        working-directory: learning-studio
        run: |
          npm test
          node --check app.js
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s manifest.webmanifest
          test -s sw.js
          test -s icon.svg
          test -s curriculum-data.js
      - name: Build WorldForge production site
        run: pnpm build
      - name: Package Learning Studio under its own path
        run: |
          mkdir -p dist/learning-studio
          cp learning-studio/index.html learning-studio/app.js learning-studio/styles.css learning-studio/manifest.webmanifest learning-studio/sw.js learning-studio/icon.svg learning-studio/curriculum-data.js dist/learning-studio/
      - name: Verify both production entry points
        run: |
          test -s dist/index.html
          test -s dist/worldforge.svg
          test -s dist/learning-studio/index.html
          test -s dist/learning-studio/app.js
          test -s dist/learning-studio/curriculum-data.js
          find dist -maxdepth 2 -type f
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
